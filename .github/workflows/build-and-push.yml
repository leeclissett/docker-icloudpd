name: Build and Push Docker Image

# Fork of boredazfcuk/docker-icloudpd. Publishes one immutable tag per build version to this
# repository owner's GitHub Container Registry: ghcr.io/<owner>/icloudpd:1.0.<build_version>.
# No "latest" tag and no Docker Hub push, so a deployment pins an exact version or digest.

on:
  push:
    branches:
      - master
    paths:
      - build_version.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build version
        id: version
        run: |
          BUILD_VERSION=$(cat build_version.txt | tr -d '[:space:]')
          echo "version_tag=1.0.${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: docker run --rm -v "$PWD:/src" -w /src alpine:3.23.4 sh -c "apk add --no-progress --no-cache coreutils >/dev/null && sh tests/run_tests.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: icloudpd.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/icloudpd:${{ steps.version.outputs.version_tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/icloudpd:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/icloudpd:buildcache,mode=max
